<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 440px; margin: 0; padding: 14px; font: 13px system-ui, "Segoe UI", sans-serif; color: #1d1d1f; background: #fff; }
    h1 { font-size: 15px; margin: 0 0 4px; }
    p.hint { margin: 0 0 10px; color: #555; }
    button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid #bbb; background: #f4f4f4; cursor: pointer; }
    button.primary { background: #1a73e8; border-color: #1a73e8; color: #fff; }
    button:disabled { opacity: .5; cursor: default; }
    .row { display: flex; gap: 6px; margin-bottom: 10px; }
    #status { min-height: 18px; margin-bottom: 10px; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 8px; }
    td { padding: 5px 4px; border-bottom: 1px solid #e3e3e3; vertical-align: top; }
    td:first-child { width: 46%; color: #333; }
    .ok { color: #137333; font-weight: 600; } .bad { color: #c5221f; font-weight: 600; } .warn { color: #b06000; font-weight: 600; }
    .detail { color: #666; font-weight: 400; font-size: 11px; }
  </style>
</head>
<body>
  <h1>Scout tab feasibility test</h1>
  <p class="hint">Open a Crunchyroll episode, start it playing, then press Run. The test opens a muted second copy in a small window in front for a few seconds, then brings your episode back to the front. It takes about a minute. You can close this popup; reopen it to see the results.</p>
  <div class="row">
    <button id="run" class="primary">Run test</button>
    <button id="copy">Copy results</button>
  </div>
  <div id="status"></div>
  <table id="results"></table>
  <script src="popup.js"></script>
</body>
</html>
