<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 320px; margin: 0; padding: 14px; font: 13px system-ui, "Segoe UI", sans-serif; color: #1d1d1f; background: #fff; }
    h1 { font-size: 15px; margin: 0 0 10px; }
    #toggle { width: 100%; font: inherit; font-weight: 600; padding: 9px; border-radius: 6px; border: 0; background: #1a73e8; color: #fff; cursor: pointer; }
    #toggle.on { background: #c5221f; }
    #toggle:disabled { opacity: .5; cursor: default; }
    #status { margin: 8px 0 12px; min-height: 18px; color: #555; }
    #status.error { color: #c5221f; }
    #diag { margin: -6px 0 12px; padding: 6px 8px; border-radius: 6px; background: #f4f4f4; color: #444; font-size: 11px; line-height: 1.5; }
    fieldset { border: 1px solid #e3e3e3; border-radius: 6px; margin: 0 0 10px; padding: 8px 10px; }
    legend { font-weight: 600; padding: 0 4px; }
    label { display: block; margin: 4px 0; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 6px 0; }
    select, input[type=number] { font: inherit; }
    input[type=number] { width: 60px; }
    .sub { margin-left: 22px; color: #555; }
  </style>
</head>
<body>
  <h1>CC Translator</h1>
  <button id="toggle">Start captions on this tab</button>
  <div id="status"></div>
  <div id="diag" hidden></div>

  <fieldset id="timingSettings" hidden>
    <legend>Caption timing</legend>
    <label><input type="radio" name="timing" value="live"> Live: captions appear as words are spoken</label>
    <label><input type="radio" name="timing" value="wait"> Wait for each line: pause after each sentence</label>
    <div class="row sub">Show each line for
      <span><input type="number" id="holdSeconds" min="0" max="10" step="0.5"> s</span>
    </div>
  </fieldset>

  <fieldset>
    <legend>Display</legend>
    <div class="row">Show
      <select id="show">
        <option value="both">Spanish + English</option>
        <option value="es">Spanish only</option>
        <option value="en">English only</option>
      </select>
    </div>
    <div class="row">Order
      <select id="order">
        <option value="es-first">Spanish on top</option>
        <option value="en-first">English on top</option>
      </select>
    </div>
    <div class="row">Text size (px) <input type="number" id="fontSize" min="12" max="64"></div>
    <div class="row">Position (% from top) <input type="number" id="position" min="10" max="98"></div>
  </fieldset>

  <fieldset>
    <legend>Helper</legend>
    <div class="row">Address <input id="helperUrl" style="width: 170px"></div>
  </fieldset>

  <script src="settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
